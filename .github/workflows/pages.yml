name: Deploy AggLink website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        shell: bash
        run: |
          cat .video-parts/quarry-conveyor.mp4.b64.part-* > quarry-conveyor.mp4.b64
          base64 --decode quarry-conveyor.mp4.b64 > quarry-conveyor.mp4
          mkdir _site
          cp index.html .nojekyll *.jpg *.webp *.mp4 _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
